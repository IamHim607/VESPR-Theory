<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي هندسة الجزيئات</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #06b6d4;
            --accent: #a855f7;
            --success: #10b981;
            --danger: #f43f5e;
            --text: #f8fafc;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .game-container {
            width: 100%;
            max-width: 760px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* شريط المعلومات العلوي */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 10px;
        }

        .game-title {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .stats {
            display: flex;
            gap: 15px;
            align-items: center;
            font-weight: 700;
        }

        .hearts { color: var(--danger); letter-spacing: 3px; font-size: 1.2rem; }
        .score { color: var(--primary); }

        /* شريط التنقل السريع بين المراحل */
        .stage-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            background: var(--bg);
            color: #94a3b8;
            border: 1px solid var(--border);
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        /* صندوق المهام التفاعلي */
        .box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
        }

        .goal {
            background: rgba(168, 85, 247, 0.12);
            border: 1px solid var(--accent);
            color: #e9d5ff;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }

        .msg-feedback {
            text-align: center;
            font-weight: 700;
            min-height: 24px;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        /* أزرار وخيارات عامة */
        .btn-main {
            background: var(--primary);
            color: var(--bg);
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-main:hover { opacity: 0.9; }

        .option-btn, .slot {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            text-align: right;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: block;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(6, 182, 212, 0.1);
        }

        .slot {
            border-style: dashed;
            color: #94a3b8;
            cursor: default;
        }

        .slot.filled, .option-btn.correct {
            border-style: solid;
            border-color: var(--success);
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
        }

        .option-btn.wrong {
            border-color: var(--danger);
            background: rgba(244, 63, 94, 0.15);
            color: #fda4af;
        }

        /* المحاكي البصري SVG */
        .svg-area {
            width: 100%;
            height: 175px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .ctrl-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .ctrl-btn {
            background: var(--primary);
            color: var(--bg);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            font-weight: 900;
            font-size: 1.1rem;
            cursor: pointer;
        }

        /* بطاقة المركب والمنزلق */
        .compound-info {
            text-align: center;
            padding: 14px;
            background: var(--card);
            border: 1px solid var(--accent);
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .formula { font-size: 2rem; font-weight: 900; color: var(--primary); }

        .slider-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            width: 80%;
            max-width: 380px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-bar">
        <div class="game-title">🧪 محاكي هندسة الجزيئات</div>
        <div class="stats">
            <span class="hearts" id="heartsDisplay">♥♥♥</span>
            <span class="score" id="scoreDisplay">0 نقطة</span>
        </div>
    </div>

    <div class="stage-tabs" id="stageTabs">
        <button class="tab-btn active" onclick="goToStage(1)">1. خطوات التنبؤ</button>
        <button class="tab-btn" onclick="goToStage(2)">2. تركيب الجزيئات</button>
        <button class="tab-btn" onclick="goToStage(3)">3. معايرة الزوايا</button>
        <button class="tab-btn" onclick="goToStage(4)">4. تصنيف المركبات</button>
        <button class="tab-btn" onclick="goToStage(5)">5. ترتيب الزوايا</button>
    </div>

    <div id="mount"></div>
</div>

<script>
    /* --- الصوتيات المبسطة --- */
    let audioCtx = null;
    function sfx(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'ok') {
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.setValueAtTime(800, now + 0.06);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'err') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, now);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            }
        } catch(e) {}
    }

    function shuffle(arr) {
        let a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    /* --- حالة اللعبة --- */
    let state = { score: 0, lives: 3 };

    function updateHUD() {
        document.getElementById('scoreDisplay').innerText = `${state.score} نقطة`;
        document.getElementById('heartsDisplay').innerText = '♥'.repeat(state.lives) + '♡'.repeat(3 - state.lives);
    }

    function reward(pts, msg = "إجابة صحيحة! ✓") {
        sfx('ok');
        state.score += pts;
        updateHUD();
        showMsg(msg, "#10b981");
    }

    function penalize(msg = "حاول مرة أخرى! ✗") {
        sfx('err');
        state.lives--;
        if (state.lives <= 0) state.lives = 3;
        updateHUD();
        showMsg(msg, "#f43f5e");
    }

    function showMsg(txt, color) {
        const el = document.getElementById('feedback');
        if (el) { el.innerText = txt; el.style.color = color; }
    }

    function goToStage(num) {
        document.querySelectorAll('.tab-btn').forEach((b, i) => {
            b.classList.toggle('active', i === num - 1);
        });
        if (num === 1) loadStage1();
        if (num === 2) loadStage2();
        if (num === 3) loadStage3();
        if (num === 4) loadStage4();
        if (num === 5) loadStage5();
    }

    /* ================= المرحلة 1 ================= */
    const stepsData = [
        { id: 1, text: "اختيار الذرة المركزية (Choose the central atom): تحديد الذرة المركزية في المركب." },
        { id: 2, text: "حساب عدد الذرات المرتبطة والأزواج الحرة (Count bonded atoms & lone pairs)." },
        { id: 3, text: "تحديد الشكل الهندسي (Determine the molecular shape) وزاوية الرابطة." }
    ];
    let stepProgress = 1;

    function loadStage1() {
        stepProgress = 1;
        const mount = document.getElementById('mount');
        mount.innerHTML = `
            <div class="box">
                <div class="goal">انقر على الخطوات بالترتيب العلمي الصحيح (1 ثم 2 ثم 3):</div>
                <div id="slotsWrap">
                    <div class="slot" id="s1">الخطوة 1: [ فارغة ]</div>
                    <div class="slot" id="s2">الخطوة 2: [ فارغة ]</div>
                    <div class="slot" id="s3">الخطوة 3: [ فارغة ]</div>
                </div>
                <hr style="border-color: var(--border); margin: 12px 0;">
                <div id="poolWrap"></div>
                <div class="msg-feedback" id="feedback"></div>
            </div>
        `;
        const pool = document.getElementById('poolWrap');
        shuffle(stepsData).forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = s.text;
            btn.onclick = () => {
                if (s.id === stepProgress) {
                    reward(100);
                    const slot = document.getElementById(`s${stepProgress}`);
                    slot.innerText = `✓ ${stepProgress}: ${s.text}`;
                    slot.classList.add('filled');
                    btn.style.display = 'none';
                    stepProgress++;
                    if (stepProgress > 3) setTimeout(() => goToStage(2), 500);
                } else {
                    penalize("ترتيب غير صحيح، ابدأ بالخطوة الأسبَق علمياً!");
                }
            };
            pool.appendChild(btn);
        });
    }

    /* ================= المرحلة 2 ================= */
    const forgeMissions = [
        { shape: "منحنٍ - Bent", angle: "105°", bonds: 2, lones: 2 },
        { shape: "مثلث مسطح - Trigonal planar", angle: "120°", bonds: 3, lones: 0 },
        { shape: "هرم ثلاثي - Trigonal pyramidal", angle: "107°", bonds: 3, lones: 1 },
        { shape: "خطي - Linear", angle: "180°", bonds: 2, lones: 0 },
        { shape: "هرم رباعي السطوح - Tetrahedral", angle: "109.5°", bonds: 4, lones: 0 }
    ];
    let s2List = [], s2Idx = 0, bState = { bonds: 1, lones: 0 };

    function loadStage2() {
        s2List = shuffle(forgeMissions);
        s2Idx = 0;
        renderStage2();
    }

    function renderStage2() {
        if (s2Idx >= s2List.length) { goToStage(3); return; }
        bState = { bonds: 1, lones: 0 };
        const m = s2List[s2Idx];
        document.getElementById('mount').innerHTML = `
            <div class="box">
                <div class="goal">ركّب الشكل (${s2Idx + 1}/${s2List.length}): [ ${m.shape} ] بزاوية [ ${m.angle} ]</div>
                <div class="svg-area">
                    <svg id="svg2" viewBox="0 0 240 160" style="height:100%;"></svg>
                </div>
                <div class="controls">
                    <div class="ctrl-box">
                        <span>ذرات مرتبطة:</span>
                        <button class="ctrl-btn" onclick="modB('bonds',-1)">-</button>
                        <b id="bVal">1</b>
                        <button class="ctrl-btn" onclick="modB('bonds',1)">+</button>
                    </div>
                    <div class="ctrl-box">
                        <span>أزواج حرة:</span>
                        <button class="ctrl-btn" onclick="modB('lones',-1)">-</button>
                        <b id="lVal">0</b>
                        <button class="ctrl-btn" onclick="modB('lones',1)">+</button>
                    </div>
                    <button class="btn-main" onclick="checkStage2()">تحقق ✓</button>
                </div>
                <div class="msg-feedback" id="feedback"></div>
            </div>
        `;
        drawMolecule();
    }

    function modB(k, d) {
        bState[k] = Math.max(0, Math.min(k === 'bonds' ? 4 : 2, bState[k] + d));
        document.getElementById(k === 'bonds' ? 'bVal' : 'lVal').innerText = bState[k];
        drawMolecule();
    }

    function drawMolecule() {
        const svg = document.getElementById('svg2');
        if (!svg) return;
        const cx = 120, cy = 80, b = bState.bonds, l = bState.lones;
        let pts = [], lps = [];

        if (b === 1) pts.push({x: cx+60, y: cy});
        else if (b === 2) {
            if (l === 0) { pts.push({x: cx-65, y: cy}, {x: cx+65, y: cy}); }
            else { pts.push({x: cx-50, y: cy+42}, {x: cx+50, y: cy+42}); }
        } else if (b === 3) {
            if (l === 0) { pts.push({x: cx, y: cy-60}, {x: cx-55, y: cy+35}, {x: cx+55, y: cy+35}); }
            else { pts.push({x: cx-55, y: cy+38}, {x: cx, y: cy+52}, {x: cx+55, y: cy+38}); }
        } else if (b === 4) {
            pts.push({x: cx, y: cy-60}, {x: cx-58, y: cy+42}, {x: cx-8, y: cy+52}, {x: cx+58, y: cy+38});
        }

        if (l === 1) lps.push({x1: cx-6, y1: cy-35, x2: cx+6, y2: cy-35});
        if (l === 2) lps.push({x1: cx-22, y1: cy-32, x2: cx-12, y2: cy-36}, {x1: cx+12, y1: cy-36, x2: cx+22, y2: cy-32});

        let html = '';
        pts.forEach(p => {
            html += `<line x1="${cx}" y1="${cy}" x2="${p.x}" y2="${p.y}" stroke="#06b6d4" stroke-width="4"/>`;
            html += `<circle cx="${p.x}" cy="${p.y}" r="11" fill="#06b6d4"/>`;
        });
        html += `<circle cx="${cx}" cy="${cy}" r="16" fill="#a855f7"/>`;
        lps.forEach(lp => {
            html += `<circle cx="${lp.x1}" cy="${lp.y1}" r="3.5" fill="#f43f5e"/>`;
            html += `<circle cx="${lp.x2}" cy="${lp.y2}" r="3.5" fill="#f43f5e"/>`;
        });
        svg.innerHTML = html;
    }

    function checkStage2() {
        const m = s2List[s2Idx];
        if (bState.bonds === m.bonds && bState.lones === m.lones) {
            reward(150);
            s2Idx++;
            setTimeout(renderStage2, 400);
        } else {
            penalize(`تلميح: راجع عدد الروابط والأزواج الحرة لشكل (${m.shape})`);
        }
    }

    /* ================= المرحلة 3 ================= */
    const anglesList = [105, 107, 109.5, 120, 180];
    const angleTasks = [
        { shape: "خطي - Linear", target: 180 },
        { shape: "مثلث مسطح - Trigonal planar", target: 120 },
        { shape: "هرم رباعي السطوح - Tetrahedral", target: 109.5 },
        { shape: "هرم ثلاثي - Trigonal pyramidal", target: 107 },
        { shape: "منحنٍ - Bent", target: 105 }
    ];
    let s3List = [], s3Idx = 0, curAngle = 105;

    function loadStage3() {
        s3List = shuffle(angleTasks);
        s3Idx = 0;
        renderStage3();
    }

    function renderStage3() {
        if (s3Idx >= s3List.length) { goToStage(4); return; }
        curAngle = 105;
        const m = s3List[s3Idx];
        document.getElementById('mount').innerHTML = `
            <div class="box">
                <div class="goal">اضبط المؤشر على زاوية الشكل (${s3Idx + 1}/${s3List.length}): [ ${m.shape} ]</div>
                <div class="svg-area">
                    <svg id="svg3" viewBox="0 0 240 160" style="height:100%;"></svg>
                </div>
                <div class="slider-box">
                    <b id="angTxt" style="font-size:1.6rem; color:var(--primary);">105°</b>
                    <input type="range" min="0" max="4" step="1" value="0" oninput="updAngle(this.value)">
                    <button class="btn-main" onclick="checkStage3()">تأكيد الزاوية ✓</button>
                </div>
                <div class="msg-feedback" id="feedback"></div>
            </div>
        `;
        drawAngle(105);
    }

    function updAngle(idx) {
        curAngle = anglesList[idx];
        document.getElementById('angTxt').innerText = `${curAngle}°`;
        drawAngle(curAngle);
    }

    function drawAngle(deg) {
        const svg = document.getElementById('svg3');
        if (!svg) return;
        const rad = (deg * Math.PI) / 180 / 2;
        const x1 = 120 - 65 * Math.sin(rad), y1 = 70 + 65 * Math.cos(rad);
        const x2 = 120 + 65 * Math.sin(rad), y2 = 70 + 65 * Math.cos(rad);
        svg.innerHTML = `
            <line x1="120" y1="70" x2="${x1}" y2="${y1}" stroke="#06b6d4" stroke-width="4"/>
            <line x1="120" y1="70" x2="${x2}" y2="${y2}" stroke="#06b6d4" stroke-width="4"/>
            <circle cx="120" cy="70" r="15" fill="#a855f7"/>
            <circle cx="${x1}" cy="${y1}" r="11" fill="#06b6d4"/>
            <circle cx="${x2}" cy="${y2}" r="11" fill="#06b6d4"/>
        `;
    }

    function checkStage3() {
        if (curAngle === s3List[s3Idx].target) {
            reward(150);
            s3Idx++;
            setTimeout(renderStage3, 400);
        } else {
            penalize("الزاوية غير مطابقة لهذا الشكل الهندسي!");
        }
    }

    /* ================= المرحلة 4 ================= */
    const compounds = [
        { formula: "H₂O", name: "الماء", desc: "ذرتان مرتبطتان + زوجان حران (2,2)", ans: "منحنٍ - Bent" },
        { formula: "CH₄", name: "الميثان", desc: "4 ذرات مرتبطة + 0 أزواج حرة", ans: "هرم رباعي السطوح - Tetrahedral" },
        { formula: "NH₃", name: "الأمونيا", desc: "3 ذرات مرتبطة + زوج حر واحد (1)", ans: "هرم ثلاثي - Trigonal pyramidal" },
        { formula: "BF₃", name: "ثالث فلوريد البورون", desc: "3 ذرات مرتبطة + 0 أزواج حرة", ans: "مثلث مسطح - Trigonal planar" },
        { formula: "CO₂", name: "ثاني أكسيد الكربون", desc: "ذرتان مرتبطتان + 0 أزواج حرة", ans: "خطي - Linear" }
    ];
    const shapeNames = ["خطي - Linear", "مثلث مسطح - Trigonal planar", "هرم ثلاثي - Trigonal pyramidal", "منحنٍ - Bent", "هرم رباعي السطوح - Tetrahedral"];
    let s4List = [], s4Idx = 0;

    function loadStage4() {
        s4List = shuffle(compounds);
        s4Idx = 0;
        renderStage4();
    }

    function renderStage4() {
        if (s4Idx >= s4List.length) { goToStage(5); return; }
        const c = s4List[s4Idx];
        document.getElementById('mount').innerHTML = `
            <div class="box">
                <div class="goal">حدد الشكل الهندسي للمركب (${s4Idx + 1}/${s4List.length}):</div>
                <div class="compound-info">
                    <div class="formula">${c.formula}</div>
                    <div style="color:var(--accent); font-weight:700; margin:4px 0;">${c.name}</div>
                    <div style="font-size:0.9rem; color:#cbd5e1;">${c.desc}</div>
                </div>
                <div id="choicesWrap"></div>
                <div class="msg-feedback" id="feedback"></div>
            </div>
        `;
        const wrap = document.getElementById('choicesWrap');
        shuffle(shapeNames).forEach(sh => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = sh;
            btn.onclick = () => {
                if (sh === c.ans) {
                    btn.classList.add('correct');
                    reward(120);
                    s4Idx++;
                    setTimeout(renderStage4, 450);
                } else {
                    btn.classList.add('wrong');
                    btn.disabled = true;
                    penalize();
                }
            };
            wrap.appendChild(btn);
        });
    }

    /* ================= المرحلة 5 ================= */
    const rankItems = [
        { name: "خطي - Linear", angle: 180, rank: 1 },
        { name: "مثلث مسطح - Trigonal planar", angle: 120, rank: 2 },
        { name: "هرم رباعي السطوح - Tetrahedral", angle: 109.5, rank: 3 },
        { name: "هرم ثلاثي - Trigonal pyramidal", angle: 107, rank: 4 },
        { name: "منحنٍ - Bent", angle: 105, rank: 5 }
    ];
    let expRank = 1;

    function loadStage5() {
        expRank = 1;
        document.getElementById('mount').innerHTML = `
            <div class="box">
                <div class="goal">انقر على الأشكال تنازلياً من [ الأكبر زاوية ] إلى [ الأصغر زاوية ]:</div>
                <div class="grid-2" id="sortWrap"></div>
                <div class="msg-feedback" id="feedback"></div>
            </div>
        `;
        const wrap = document.getElementById('sortWrap');
        shuffle(rankItems).forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.style.textAlign = 'center';
            btn.innerText = item.name;
            btn.onclick = () => {
                if (btn.disabled) return;
                if (item.rank === expRank) {
                    btn.classList.add('correct');
                    btn.disabled = true;
                    btn.innerText = `✓ #${expRank}: ${item.name} (${item.angle}°)`;
                    reward(150);
                    expRank++;
                    if (expRank > 5) setTimeout(showWinScreen, 500);
                } else {
                    penalize("ليست الأكبر حالياً، تذكر قيم الزوايا!");
                }
            };
            wrap.appendChild(btn);
        });
    }

    /* --- شاشة النهاية --- */
    function showWinScreen() {
        document.getElementById('mount').innerHTML = `
            <div class="box" style="text-align:center; padding: 30px 15px;">
                <h2 style="color:var(--success); margin-bottom:10px;">🎉 اكتمل التحدي بنجاح!</h2>
                <p style="color:#cbd5e1; margin-bottom:20px;">أتقنت جميع مراحل هندسة الجزيئات وزوايا الروابط.</p>
                <div style="font-size:2.4rem; font-weight:900; color:var(--primary); margin-bottom:20px;">${state.score} نقطة</div>
                <button class="btn-main" onclick="resetAll()">إعادة اللعب من البداية ↺</button>
            </div>
        `;
    }

    function resetAll() {
        state = { score: 0, lives: 3 };
        updateHUD();
        goToStage(1);
    }

    // التشغيل الفوري عند فتح الصفحة
    loadStage1();
</script>

</body>
</html>
